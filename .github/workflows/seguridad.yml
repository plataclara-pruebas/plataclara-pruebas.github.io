name: seguridad
# Controles automáticos de seguridad. Permisos mínimos; acciones de terceros fijadas a commit completo.
on:
  pull_request:
  push:
    branches: [master, main]
  schedule:
    - cron: '17 6 * * 1'   # lunes: detecta vulnerabilidades nuevas aunque no haya cambios
permissions:
  contents: read
jobs:
  secretos:
    name: Gitleaks (archivos e historial)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Instalar Gitleaks 8.30.1 (hash verificado)
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
      - name: Escanear historial completo
        run: ./gitleaks git --redact=100 --no-banner --config .seguridad/gitleaks.toml --exit-code 1 .
      - name: Escanear archivos
        run: ./gitleaks dir --redact=100 --no-banner --config .seguridad/gitleaks.toml --exit-code 1 .
  js:
    name: ESLint seguridad (incluye JS embebido en HTML)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .seguridad
      - run: npm run lint
        working-directory: .seguridad
      - name: Vulnerabilidades conocidas en herramientas
        run: npm audit --audit-level=high
        working-directory: .seguridad
  semgrep:
    name: Semgrep 1.187.0 (reglas propias, JS embebido extraído)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - run: node .seguridad/extraer-js.mjs
      - run: pip install --quiet semgrep==1.187.0
      - name: Semgrep (sin métricas, reglas locales)
        env: { SEMGREP_SEND_METRICS: 'off' }
        run: semgrep scan --metrics=off --error --severity ERROR --config .seguridad/semgrep-reglas.yml .seguridad/build config.js
